name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-deploy-freito
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.FREITO_VPS_SSH_KEY }}
          HOST: ${{ secrets.FREITO_VPS_HOST }}
          USER: ${{ secrets.FREITO_VPS_USER }}
          PORT: ${{ secrets.FREITO_VPS_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${PORT:-22}" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" -o StrictHostKeyChecking=yes \
            "$USER@$HOST" "bash /home/ubuntu/deploy-scripts/deploy-freito.sh"
